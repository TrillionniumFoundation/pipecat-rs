[package]
name = "pipecat-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "pipecat-voice-agent"
path = "src/main.rs"

[dependencies]
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = "0.28"
getrandom = "0.3.4"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
pipecat-vad = { path = "../pipecat-vad" }
pipecat-core = { path = "../pipecat-core" }
pipecat-audio = { path = "../pipecat-audio" }
pipecat-media-transport = { path = "../pipecat-media-transport", features = ["assistant-history"] }
pipecat-protocol = { path = "../pipecat-protocol" }
pipecat-services = { path = "../pipecat-services" }
pipecat-transports = { path = "../pipecat-transports" }
pipecat-turns = { path = "../pipecat-turns" }
pipecat-streaming-speech = { path = "../pipecat-streaming-speech" }

[lints]
workspace = true
