[package]
name = "pipecat-evals"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Explicit autonomous single-run text evaluation. No credentials or providers by default.
simulation = ["dep:pipecat-services"]
user-images = ["dep:pipecat-images"]
# Explicit Cartesia scripted user audio; does not activate ONNX/VAD.
user-speech = ["dep:pipecat-speech", "dep:sha2", "dep:rustix"]
# Explicit real-time PCM -> Silero -> HTTP STT response evaluation.
bot-audio-transcription = ["dep:pipecat-speech", "dep:pipecat-vad", "dep:pipecat-services"]
# Native child executable used only by the process ownership integration tests.
process-fixtures = []
native-bot-example = ["dep:pipecat-processors", "dep:pipecat-services", "dep:reqwest"]

[[test]]
name = "bot_audio_response"
path = "tests/bot_audio_response.rs"
required-features = ["bot-audio-transcription"]

[[test]]
name = "bot_audio_response_cli"
path = "tests/bot_audio_response_cli.rs"
required-features = ["bot-audio-transcription"]

[[bin]]
name = "eval-process-fixture"
path = "tests/support/process_fixture.rs"
required-features = ["process-fixtures"]

[[bin]]
name = "native-text-bot"
path = "src/bin/native-text-bot.rs"
required-features = ["native-bot-example"]

[[example]]
name = "native_text_bot"
path = "examples/native_text_bot.rs"
required-features = ["native-bot-example"]

[dependencies]
pipecat-images = { path = "../pipecat-images", optional = true }
pipecat-speech = { path = "../pipecat-speech", optional = true }
pipecat-vad = { path = "../pipecat-vad", optional = true }
pipecat-audio = { path = "../pipecat-audio" }
pipecat-processors = { path = "../pipecat-processors", optional = true }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls"], optional = true }
pipecat-core = { path = "../pipecat-core" }
pipecat-rtvi = { path = "../pipecat-rtvi" }
pipecat-services = { path = "../pipecat-services", optional = true }
pipecat-turns = { path = "../pipecat-turns" }
pipecat-classifiers = { path = "../pipecat-classifiers" }
pipecat-protocol = { path = "../pipecat-protocol" }
pipecat-transports = { path = "../pipecat-transports" }
tokio = { workspace = true, features = ["signal", "fs", "process"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
serde_yaml = "0.9.34"
url = "2"
base64 = "0.22.1"
sha2 = { version = "0.10", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1.5", features = ["fs", "process"], optional = true }

[lints]
workspace = true

[[test]]
name = "bot_audio_response_suite"
required-features = ["bot-audio-transcription"]

[[bin]]
name = "eval-image-fixture"
path = "tests/support/image_bot.rs"
required-features = ["user-images", "native-bot-example"]

[dev-dependencies]
png = "=0.18.1"
jpeg-encoder = { version = "=0.6.1", default-features = false, features = ["std"] }
jpeg-decoder = { version = "=0.3.2", path = "../../vendor/jpeg-decoder-0.3.2", default-features = false, features = ["platform_independent"] }

[[test]]
name = "simulation"
required-features = ["simulation"]

[[test]]
name = "batch156_evals_regressions"
required-features = ["process-fixtures"]
