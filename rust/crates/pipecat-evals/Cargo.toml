[package]
name = "pipecat-evals"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Native child executable used only by the process ownership integration tests.
process-fixtures = []

[[bin]]
name = "eval-process-fixture"
path = "tests/support/process_fixture.rs"
required-features = ["process-fixtures"]

[dependencies]
pipecat-classifiers = { path = "../pipecat-classifiers" }
pipecat-protocol = { path = "../pipecat-protocol" }
pipecat-transports = { path = "../pipecat-transports" }
tokio = { workspace = true, features = ["signal", "fs", "process"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
serde_yaml = "0.9.34"
url = "2"
base64 = "0.22.1"

[lints]
workspace = true
