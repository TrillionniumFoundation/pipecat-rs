pipecat-responses = { path = "../pipecat-responses", optional = true }

[features]
wake-check = ["pipecat-processors/wake-check"]
deepgram-ws = ["pipecat-speech/deepgram-ws"]
openai-stt = ["pipecat-streaming-speech/openai-stt"]
http-smart-turn = ["pipecat-vad/http-smart-turn"]
voicemail = ["pipecat-processors/voicemail"]
assistant-history = ["pipecat-media-transport/assistant-history"]
openclaw = ["dep:pipecat-openclaw"]
classifiers = ["dep:pipecat-classifiers"]
deepgram-flux = ["dep:pipecat-deepgram-flux"]
grok-realtime = ["dep:pipecat-grok-realtime"]
azure-realtime = ["dep:pipecat-azure-realtime"]
inworld-realtime = ["dep:pipecat-inworld-realtime"]
images = ["dep:pipecat-images"]
speechmatics = ["dep:pipecat-speechmatics", "pipecat-speech/speechmatics"]
minimax = ["pipecat-speech/minimax"]
speechify = ["pipecat-speech/speechify"]
soniox = ["dep:pipecat-soniox"]
gladia = ["dep:pipecat-gladia"]
gradium = ["dep:pipecat-gradium"]
moonshine = ["dep:pipecat-moonshine"]
assemblyai = ["dep:pipecat-assemblyai"]
aws-bedrock = ["dep:pipecat-aws-bedrock"]
aws-speech = ["dep:pipecat-aws-speech"]
moq = ["dep:pipecat-moq"]
piper = ["dep:pipecat-piper"]
rnnoise = ["dep:pipecat-rnnoise"]
agent-workers = ["dep:pipecat-agent-workers"]
whisper = ["dep:pipecat-whisper"]
livekit = ["dep:pipecat-livekit"]
evals = ["dep:pipecat-evals"]
elevenlabs = ["dep:pipecat-elevenlabs"]
gemini-live = ["dep:pipecat-gemini-live"]
mcp = ["dep:pipecat-mcp"]
local-audio = ["dep:pipecat-local-audio"]
worker-proxy = ["dep:pipecat-worker-proxy"]
client-server = ["dep:pipecat-client-server"]
pgmq = ["pipecat-network-bus/pgmq"]
webrtc = ["dep:pipecat-webrtc"]
realtime = ["dep:pipecat-realtime"]
responses = ["dep:pipecat-responses"]

[dev-dependencies]
base64 = "=0.22.1"
jpeg-decoder = { version = "=0.3.2", path = "../../vendor/jpeg-decoder-0.3.2", default-features = false, features = ["platform_independent"] }
tokio.workspace = true
bytes.workspace = true
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }

[lints]
workspace = true
