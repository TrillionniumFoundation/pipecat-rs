[package]
name = "pipecat-speech"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
deepgram-ws = ["dep:tokio-tungstenite"]
minimax = []
speechmatics = []
speechify = []

[dependencies]
pipecat-audio = { path = "../pipecat-audio" }
pipecat-core = { path = "../pipecat-core" }
pipecat-services = { path = "../pipecat-services" }
pipecat-text = { path = "../pipecat-text" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.28", optional = true, features = ["rustls-tls-webpki-roots"] }
thiserror.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
futures-util = "0.3"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
pipecat-vad = { path = "../pipecat-vad" }
pipecat-turns = { path = "../pipecat-turns" }
pipecat-media-transport = { path = "../pipecat-media-transport" }
pipecat-pipeline = { path = "../pipecat-pipeline" }

[lints]
workspace = true
