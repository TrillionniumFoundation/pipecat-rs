[package]
name = "pipecat-piper"
version.workspace = true
edition.workspace = true
license = "BSD-2-Clause AND MIT"
rust-version.workspace = true

[features]
default = []
onnx = ["dep:ort", "dep:ort-sys", "dep:ndarray", "dep:libloading"]
# Explicit opt-in to an in-process GPL-3.0-or-later native dependency.
espeak-gpl = ["onnx"]

[dependencies]
pipecat-audio = { path = "../pipecat-audio" }
pipecat-core = { path = "../pipecat-core" }
pipecat-services = { path = "../pipecat-services" }
pipecat-text = { path = "../pipecat-text" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2 = "=0.10.9"
unicode-normalization = "=0.1.25"
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["load-dynamic", "ndarray"], optional = true }
ort-sys = { version = "=2.0.0-rc.9", default-features = false, features = ["load-dynamic"], optional = true }
ndarray = { version = "=0.16.1", optional = true }
libloading = { version = "=0.8.9", optional = true }

[dev-dependencies]
pipecat-media-transport = { path = "../pipecat-media-transport" }
