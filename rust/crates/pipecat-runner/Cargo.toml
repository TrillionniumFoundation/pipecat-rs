[package]
name = "pipecat-runner"
default-run = "pipecat-browser-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "pipecat-browser-agent"
path = "src/main.rs"

[features]
default = []
webrtc = ["dep:pipecat-webrtc"]
whisper = ["dep:pipecat-whisper"]
soniox = ["dep:pipecat-soniox"]
realtime = ["dep:pipecat-realtime"]

[[bin]]
name = "pipecat-twilio-agent"
path = "src/twilio_main.rs"

[dependencies]
pipecat-realtime = { path = "../pipecat-realtime", optional = true }
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
pipecat-soniox = { path = "../pipecat-soniox", optional = true }
pipecat-processors = { path = "../pipecat-processors" }
pipecat-whisper = { path = "../pipecat-whisper", optional = true }
pipecat-webrtc = { path = "../pipecat-webrtc", optional = true }
async-trait.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
uuid = { version = "1", features = ["v4"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
url = "2"
pipecat-audio = { path = "../pipecat-audio" }
pipecat-cli = { path = "../pipecat-cli" }
pipecat-client-server = { path = "../pipecat-client-server" }
pipecat-core = { path = "../pipecat-core" }
pipecat-protocol = { path = "../pipecat-protocol" }
pipecat-rtvi = { path = "../pipecat-rtvi" }
pipecat-services = { path = "../pipecat-services" }
pipecat-streaming-speech = { path = "../pipecat-streaming-speech" }
pipecat-transports = { path = "../pipecat-transports" }
pipecat-turns = { path = "../pipecat-turns" }
pipecat-vad = { path = "../pipecat-vad" }

[dev-dependencies]
futures-util = "=0.3.34"
pipecat-browser-client = { path = "../../client-templates" }

[lints]
workspace = true

[[example]]
name = "soniox_voice"
required-features = ["soniox"]
