[package]
name = "pipecat-flows"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pipecat-core = { path = "../pipecat-core" }
pipecat-services = { path = "../pipecat-services" }
pipecat-turns = { path = "../pipecat-turns" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9.34"
yaml-rust2 = { version = "=0.13.0", default-features = false }
thiserror.workspace = true
tokio.workspace = true
regex = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[dev-dependencies]
pipecat-audio = { path = "../pipecat-audio" }
pipecat-media-transport = { path = "../pipecat-media-transport" }
pipecat-streaming-speech = { path = "../pipecat-streaming-speech" }
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }

[lints]
workspace = true
