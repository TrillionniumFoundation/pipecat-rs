[package]
name = "pipecat-network-bus"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pipecat-core = { path = "../pipecat-core" }
pipecat-workers = { path = "../pipecat-workers" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64 = "0.22"

[lints]
workspace = true

[features]
default = []
pgmq = ["dep:tokio-postgres", "dep:uuid"]

[dependencies.tokio-postgres]
version = "0.7"
features = ["with-serde_json-1"]
optional = true

[dependencies.uuid]
version = "1"
features = ["v4"]
optional = true
