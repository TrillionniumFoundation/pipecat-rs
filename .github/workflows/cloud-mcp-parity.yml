name: Native MCP parity

on:
  push:
    branches: [work/cloud-mcp-parity-20261013]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
      PIPECAT_ONNX_RUNTIME: /tmp/pipecat-onnx/onnxruntime/capi/libonnxruntime.so.1.21.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install workspace Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt && rustup default 1.99.0
      - name: Install pinned native Smart Turn test runtime
        run: /usr/bin/python3 -m pip install --disable-pip-version-check --no-deps --target /tmp/pipecat-onnx onnxruntime==1.21.0
      - name: Check affected package formatting
        run: cargo fmt -p pipecat-core -p pipecat-mcp -p pipecat-services -p pipecat-processors -p pipecat-pipeline -p pipecat-protocol -p pipecat-rtvi -p pipecat-turns -p pipecat-responses -p pipecat -- --check
      - name: Native MCP HTTP, stdio and affected package regressions
        run: cargo test -p pipecat-core -p pipecat-mcp -p pipecat-services -p pipecat-processors -p pipecat-pipeline -p pipecat-protocol -p pipecat-rtvi -p pipecat-turns -p pipecat-responses --features pipecat-mcp/native-fixtures,pipecat-pipeline/responses --locked
      - name: Native Gemini RTVI and Direct result lifecycle integration
        run: cargo test -p pipecat --features responses --test gemini_rtvi_search --test direct_result_policy --test direct_live_progress --test direct_context_updated --test direct_progress_context_updated --test responses_direct_tools --test direct_deferred --test direct_application_error --locked
      - name: Strict affected package checks
        run: cargo clippy -p pipecat-core -p pipecat-mcp -p pipecat-services -p pipecat-processors -p pipecat-pipeline -p pipecat-protocol -p pipecat-rtvi -p pipecat-turns -p pipecat-responses --all-targets --features pipecat-mcp/native-fixtures,pipecat-pipeline/responses --locked -- -D warnings
      - name: Strict native Gemini and Direct integration checks
        run: cargo clippy -p pipecat --features responses --test gemini_rtvi_search --test direct_result_policy --test direct_live_progress --test direct_context_updated --test direct_progress_context_updated --test responses_direct_tools --test direct_deferred --test direct_application_error --locked -- -D warnings
      - name: Strict default Direct binding feature check
        run: cargo clippy -p pipecat-pipeline --all-targets --no-default-features --locked -- -D warnings
